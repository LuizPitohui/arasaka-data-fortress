[project]
name = "arasaka-backend"
version = "0.1.0"
description = "Arasaka Corp Secure File Hosting System"
authors = [
    {name = "Luiz Guedes",email = "Pitohuikun@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = "^3.13"
dependencies = [
    "django (>=6.0.2,<7.0.0)",
    "django-ninja (==1.5.3)",
    "gunicorn (==25.1.0)",
    "uvicorn (==0.40.0)",
    "psycopg[binary] (==3.3)",
    "pydantic (==2.12.5)",
    "python-dotenv (==1.2.1)",
    "django-cors-headers (==4.9.0)",
    "minio (==7.2.20)",
    "pillow (>=12.1.1,<13.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.1,<0.16.0)",
    "black (>=26.1.0,<27.0.0)"
]
